name: Run DB Migrations

on:
  push:
    branches: ["main"]

concurrency:
  group: migrations-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migrations
        env:
          FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
        run: |
          if [ -z "$FLYWAY_URL" ] || [ -z "$FLYWAY_USER" ] || [ -z "$FLYWAY_PASSWORD" ]; then
            echo "Missing Flyway secrets" >&2
            exit 1
          fi
          docker run --rm \
            -v "$PWD/db/migration:/flyway/sql" \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            flyway/flyway:10-alpine migrate

      - name: Trigger Render deploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_HOOK }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "Missing RENDER_HOOK secret" >&2
            exit 1
          fi
          curl -sSf -X POST "$RENDER_HOOK" > /dev/null
